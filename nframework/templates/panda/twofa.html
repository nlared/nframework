<style>
    body {
        background: url("/img/bg-1.jpg") bottom right no-repeat;
        background-size: cover;
    }

    .dark-side {
        body {
            background: url("/img/bg-2.jpg") bottom right no-repeat;
            background-size: cover;
        }
    }

    .formbox {
        inset: 0;
        margin: auto;
    }
</style>
<div class="box shadow-large-extra bg-glassmorphism fg-white bd-white formbox" style="max-width:420px">
    <div class="h3 text-weight-7 border-bottom bd-white pb-2">{{lng['twofa_title']}}</div>
    <p>{{lng['twofa_info']}}</p>
    <form action="/account/twofa" method="POST" class="mt-4 mb-2">
        <div class="form-group">
            <input type="text" name="code" data-role="input" inputmode="numeric" autocomplete="one-time-code"
                pattern="[0-9 ]{6,7}" maxlength="7" required autofocus
                placeholder="{{lng['twofa_code']}}" data-prepend="<span class='mif-key'></span>" />
        </div>
        {% if msgError %}
        <div class="mt-2"><div class="remark alert fg-black">{{msgError}}</div></div>
        {% endif %}
        <div class="form-actions border-top bd-white pt-4 d-flex flex-center">
            <button class="button success">{{lng['twofa_verify']}}</button>
            <a class="ml-auto fg-white" href="/account/login">{{lng['login']}}</a>
        </div>
    </form>
    <details class="mt-4">
        <summary style="cursor:pointer">{{lng['recovery_lost']}}</summary>
        <form action="/account/twofa" method="POST" class="mt-2">
            <p><small>{{lng['recovery_use_info']}}</small></p>
            <input type="text" name="recovery" data-role="input" autocomplete="off" autocapitalize="characters" spellcheck="false"
                maxlength="40" required placeholder="XXXXX-XXXXX-XXXXX-XXXXX" data-prepend="<span class='mif-lock'></span>" />
            <button class="button warning mt-2">{{lng['recovery_use']}}</button>
        </form>
    </details>
</div>
{{nframework['themeSwitcher']|raw}}
